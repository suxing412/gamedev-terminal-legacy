<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>游戏开发者终端 · 坐席</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 值班灯：琥珀点。内联 data URI，省一次请求也省一个 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23f0a63c'/%3E%3C/svg%3E">
<!-- 各视图的样式表**排在 style.css 之前**：它们里面有 body 级排版规则，
     独立打开那些页面时要生效；而在主页里 style.css 后加载即可盖掉 body 那条，
     视图自己的排版则由 `.视图` 那半边选择器接住（见 read.css/watch.css/班次.css 的 `body, .视图`）。
     顺序反了，主页的字体与底色会被阅读页的规则接管——那不是能靠改颜色补的错，是层叠顺序错。 -->
<link rel="stylesheet" href="prose.css">
<link rel="stylesheet" href="read.css">
<!-- 人闸.css 是 2026-09-02 批二漏掉的：片段模式只把 <script src> 抠出来挂成 data-脚本，
     **<link> 是被丢掉的**，所以视图的样式表必须在这里预载。漏了不报错、不白屏，
     只是那一页在壳里长得跟没写样式一样——而独立打开它又是好的，最难对上号的一种。 -->
<link rel="stylesheet" href="人闸.css">
<link rel="stylesheet" href="watch.css">
<link rel="stylesheet" href="班次.css">
<link rel="stylesheet" href="存照.css">
<link rel="stylesheet" href="文稿.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  方向契约（impeccable · shape → craft，2026-08-26）

  THESIS：一块全屏常驻的值班屏，把「等你拍板的 / 跟总监说话 / 产线在跑什么」三件事各安其位。
    它拒绝的类别默认排布是「整屏一个聊天框」——那等于把 CLI 换个壳，人闸照样被信息流淹没。
  OWN-WORLD：近黑带极低冷灰的三层底面，hairline 分界不用阴影；中性色铺满，**唯一强调色（值班琥珀）
    只出现在人闸栏**；等宽字仅用于单号、时刻与数字列。排版手艺照 Linear，密度与状态色照 Datadog。
  STORY：抬眼就知道谁在等我、产线活着没有；要拍板时转过来说话，不是点通过/不过。
  FIRST VIEWPORT：左 340px 人闸队列（永不参与滚动，逾期越久越重），中栏对话收在 72ch，
    右 300px 计数格+在跑+事件流。顶条一行报总况。
  FORM：类别标准全力执行（制作人拍板的常设出口，非概念隐喻）；候选列表第 8 项之外的常设出口。
    seed key b6baf444。
  FINISH：unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<div class="台">

  <!--
    顶条 · 三格（2026-09-02 第一性 + 对抗性评审后重做）

    左右两栏拆成页之后，这条 44px 是屏上**唯一一处一直在视野里**的东西，
    PRODUCT.md 原则一那三问（活着 / 在跑什么 / 谁等我）全压在它身上。
    七格砍到三格，进不进来的判据是两条：**数据源不可达时也说得出真话**、
    **不需要第二个数配合就能读**。答不了的进凭幅（要紧时长出一行）或进页面。

    `data-问` 是给判据认人的：J1/J3 按它逐档量「这一问有没有一个真可见的元素」，
    而不是按 id 猜。改 id 不会让判据静默失效，删掉 data-问 才会——那是有意的。

    **`.徽` 删了。** 它是一串写死的「游戏开发者终端 · 坐席 · 总监在岗」，
    `grep 徽|在岗 public/*.js` 证明 JS 一个字都没写过它；而评审当刻
    `.值守心跳.json` 是 `无回执: 1001, 阵亡: true`。屏上最贵的 196px
    常年宣称一件系统自己判定为假的事——单用户专屏上品牌本来就是零信息，
    何况这一条还违 PRODUCT 原则五。
  -->
  <header class="顶">
    <div class="顶况" id="顶况">
      <i class="脉" id="脉点" data-问="活" title="产线连通：绿＝监制台与派单器都通，红＝任一断，灰＝这一格自己没取到数"></i>
      <!-- 人闸格：动作串可截断，**年龄章永不截断**（它是原则三"逾期会变重"的唯一载体） -->
      <span class="顶闸" id="顶闸" data-问="等"><b class="闸词">—</b></span>
      <span class="顶产" id="顶产" data-问="跑">—</span>
    </div>
    <!-- 去别处的路。**这份列表不再手写**（2026-08-30 重做）。
         原委：08-28 群聊上线当天从这个窗口根本走不过去——「东西做好了、跑起来了、
         测试全绿，人却看不见它」。当时手工补了三个 <a>；然后 08-29 的监视、
         08-30 的班次又各漏一次，因为服务端 页.js 那份改了、这份没改。
         **两份手工列表必然分叉，而分叉的表现是「新页面看不见」，不报错。**
         现在两处都从 /api/views 那一份表渲染，新增一页只改 server/render/页签.js。

         而且不再整页跳转：点页签只换主内容区（话栏那一格），
         闸栏、脉栏、顶况、输入框全部留在屏上——读一份班次报告不该让人闸队列消失。 -->
    <nav class="去" id="去"></nav>
    <!-- 形态钮独立一轨、`justify-self:end`，**任何断点都不许隐藏**：
         塔态下 `.去` 是藏起来的，这颗钮就是唯一的回程。
         它原来长在 `.顶况` 里——而那一栏自己的注释写着「那一栏是读数，
         混进跳转链接会让人以为数字也能点」：注释挡住了链接，没挡住按钮。 -->
    <button class="形态钮" id="形态钮" title="半屏塔 ⟷ 全屏工作台（F9）">半屏</button>
  </header>

  <!-- 凭据横幅：只在登录过期/临期时出现。常驻屏上多一条永久横幅就是背景噪音，
       所以它平时完全不占位，一出现就说明该动手了，且直接给出那条命令。 -->
  <!-- 幅区：三条横幅共占栅格的**同一行**。
       分开摆的话每条各占一行，而 .台 的 grid-template-rows 只留了一行 auto——
       多出来的两条会把中间那格挤成负高（`minmax(0,1fr)` 只保证不为负，不保证有内容）。 -->
  <div class="幅区" id="幅区">
  <div class="凭幅" id="凭幅" hidden>
    <span id="凭文"></span>
    <code id="凭令"></code>
    <button id="凭抄">复制</button>
  </div>
  <!-- 额度：顶条那格删了，改成**过线才长出来**。任一池 ≥85% 触发。
       原因不是省宽度：08-26 真 hit limit 那一分钟，5h 窗读数是 7%——
       那块表量的不是把闸的那个量，改阈值救不了；而它常年在 20% 徘徊，
       过线时 `.紧` 又零命中（屏上根本不变色），127px 换来的动作是零。 -->
  <div class="凭幅 额幅" id="额幅" hidden><span id="额文"></span></div>
  <!-- 陈旧哨：钟的替代品。**平时零像素、零 DOM 写入**，
       所以「连喂两轮相同数据、DOM 写入计数为 0」那条判据仍然跑得动。 -->
  <div class="凭幅 陈幅" id="陈幅" hidden><span id="陈文"></span></div>
  </div>

  <!--
    左右两栏（等你拍板 / 产线脉搏）已拆走（2026-09-02，制作人拍板）。

    去处：闸栏 → /gate 独立页；脉栏 → /watch 的产线段。
    三问（活着 / 在跑什么 / 谁等我）由顶条那三格接住，判据 J1/J3 逐档在量。

    **拆的理由不是腾地方。** 那条 340px 的栏里摊着 61 个按钮，而同一闸位的 24 单
    动作键完全相同——摊成 24 条是把一次批量处置误报成 24 个待决定；
    修法是给这一组一个「一次处置 24 单」的钮，而那个钮在 340px 里排不下。
    脉栏那边同理：它与监视页的 wev **本来就在渲染同一批事件**，同一个 事流.事条()
    在两处各画一份、各自定时刷新。

    塔况 也随之删除：它的内容（在途/在跑/待派）已被顶条产线格完整吸收。
  -->
  <main class="话栏">
    <div class="话流" id="话流">
      <div class="话">
        <div class="谁">总监</div>
        <div class="文">屋里八席都在。有话直接说——不点名则相关席应答，@ 某席就只找那一位。

右边是这屋里有谁、各自管什么；点名字开私聊。等你拍板的事在「等你拍板」那一页，产线在「监视」。</div>
      </div>
    </div>

    <!--
      在座栏（2026-09-02 拆栏 · 批五）。原来是话流上方那条一行的「在座条」。

      制作人的话：「把常驻坐席做得更人性化一点，做头像什么的」。
      **人性化不在头像本身**——一排冷头像照样填不满拆栏之后那片空地；
      是这一栏说清「这屋里有谁、各自管什么」，那片空地才变成一屋子人。

      每席一行：头像 + 名 + 人设一句话 + 在岗/未接。
      人设那句是 /api/seats 的真数据（「从项目全局给出判断与建议，但不直接改台账」）。
      **Figma 稿上那行「正在答话 / 起草 TK-234」没有实现**：那是示意值，
      而按席的实时活动现在没有任何数据源——照着画就是在编，违 PRODUCT 原则五。

      只在对话页出现，不跟去别的页签（`.话流[hidden] ~ .座栏` 收起）——
      这正是拆栏要治的那件事，新加的东西不能把它带回来。
    -->
    <aside class="座栏" id="座栏">
      <div class="座栏头">
        <h2>在座</h2>
        <span class="座数" id="座数">—</span>
      </div>
      <div class="座列" id="座组"></div>
    </aside>

    <!-- 视图区：与话流互斥，占同一格。
         **说区不参与切换**——一边看班次报告一边说话是常态，
         把输入框也换走等于「读东西时不能说话」，那就把对话从主干道降成了抽屉。 -->
    <div class="视图区" id="视图区" hidden></div>

    <div class="说区">
      <div class="说心">
        <div class="带" id="带">
          关于 <span class="号" id="带号"></span>
          <button id="带撤" title="不带这条上下文">×</button>
        </div>
        <textarea class="说框" id="说框" rows="1" placeholder="说点什么…（@ 点名某席，不点名则相关席应答）"></textarea>
        <div class="说注" id="说注">Enter 发送 · Shift+Enter 换行 · @ 点名 · / 聚焦 · F9 半屏塔</div>
      </div>
    </div>
  </main>

</div>
<!-- 闸分组 必须在 app.js 之前：app.js 在顶层就解构 self.闸分组 -->
<script src="闸分组.js"></script>
<script src="顶况.js"></script>
<script src="事流.js"></script>
<script src="app.js"></script>
<!-- 视图切换单独一个文件：它跟坐席那套（SSE、人闸、脉搏）没有共享状态，
     混进 app.js 只会让两件事互相牵连。它自己失效时主页照常能用。 -->
<script src="视图.js"></script>
</body>
</html>
